quarkus.index-dependency.rimfrost-framework-regel-tests.group-id=se.fk.rimfrost.framework.regel
quarkus.index-dependency.rimfrost-framework-regel-tests.artifact-id=rimfrost-framework-regel
quarkus.index-dependency.rimfrost-framework-regel-tests.classifier=tests

application.config.path=src/test/resources/config-test.yaml

#OUL Storage

# Disable storage handling since OUL interface is mocked in tests

regel.persistence.table-prefix = regel_kommunicering
quarkus.flyway.enabled = false
quarkus.hibernate-orm.active=false
quarkus.datasource.devservices.enabled=false

#Kafka
kafka.source=RegelKommunicering
kafka.subtopic=regel-kommunicering

#Incoming
mp.messaging.incoming.regel-requests.connector=smallrye-in-memory

#Outgoing

# This not actually used by the test, but required by upstream
mp.messaging.outgoing.regel-responses.topic=framework-regel-kommunicering

mp.messaging.outgoing.regel-responses.connector=smallrye-in-memory

# Kafka off for tests because of in-memory connector
quarkus.kafka.devservices.enabled=false

# REST client base URLs (beans mocked in tests)
sid.api.base-url=http://localhost:${quarkus.http.test-port}
permissions.api.base-url=http://localhost:${quarkus.http.test-port}
quarkus.rest-client.identity-api.url=http://localhost:${quarkus.http.test-port}