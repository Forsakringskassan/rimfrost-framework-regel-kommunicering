name: Maven Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Test GitHub Packages access
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./mvnw -s settings.xml -U --batch-mode \
            dependency:get \
            -Dartifact=se.fk.rimfrost.framework.regel.maskinell:rimfrost-framework-regel-maskinell:1.1.2 \
            -Dtransitive=false

      - name: Generate effective POM
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./mvnw -s settings.xml help:effective-pom \
            -Dverbose \
            -Doutput=effective-pom.xml

      - name: Upload effective POM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: effective-pom
          path: effective-pom.xml
